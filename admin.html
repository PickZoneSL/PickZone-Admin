
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                body {
                  background-color: white; /* Ensure the iframe has a white background */
                }

                
              </style>
                        </head>
                        <body>
                            <div class="chart-card"><h3>Order Status Overview</h3><canvas id="statusChart"></canvas></div>
<div class="chart-card"><h3>📊 Popular Categories</h3><canvas id="popularCatsChart"></canvas></div>


              <script>
                              let ordersChart,popularCatsChart,visitorsChart;

function renderDashboardCharts(orders,products){
const isDark=document.body.getAttribute('data-theme')==='dark';
const textColor=isDark?'#F9FAFB':'#111827';
const gridColor=isDark?'#334155':'#e2e8f0';

// ===== ORDER TRENDS CHART =====
const last7=[];
for(let i=6;i>=0;i--){
const d=new Date();d.setDate(d.getDate()-i);
const ds=d.toISOString().split('T')[0];
const count=orders.filter(o=>o.date&&o.date.startsWith(ds)).length;
last7.push({label:d.toLocaleDateString('en',{weekday:'short'}),count});
}

const ctx1=document.getElementById('ordersChart').getContext('2d');
if(ordersChart)ordersChart.destroy();
ordersChart=new Chart(ctx1,{
type:'line',
data:{
labels:last7.map(d=>d.label),
datasets:[{
label:'Orders',
data:last7.map(d=>d.count),
borderColor:'#6366f1',
backgroundColor:'rgba(99,102,241,0.1)',
fill:true,tension:0.4,borderWidth:3,
pointBackgroundColor:'#6366f1',
pointRadius:5,pointHoverRadius:8
}]
},
options:{
responsive:true,
animation:{duration:1500,easing:'easeOutQuart'},
plugins:{legend:{labels:{color:textColor}}},
scales:{
x:{ticks:{color:textColor},grid:{color:gridColor}},
y:{ticks:{color:textColor,stepSize:1},grid:{color:gridColor},beginAtZero:true}
}
}
});

// ===== POPULAR CATEGORIES CHART (ONLY categories with products) =====
const catCounts={};
products.forEach(p=>{
getItemCategories(p).forEach(c=>{
catCounts[c]=(catCounts[c]||0)+1;
});
});

// Sort categories by count (most popular first) and filter out zero counts
const sortedCats=Object.entries(catCounts)
.filter(([cat,count])=>count>0)
.sort((a,b)=>b[1]-a[1]);

const catNames=sortedCats.map(([cat])=>cat);
const catCountsValues=sortedCats.map(([,count])=>count);

// Color palette for bars
const barColors=[
'#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6',
'#8b5cf6','#ef4444','#14b8a6','#f97316','#84cc16',
'#06b6d4','#d946ef','#f43f5e','#a855f7','#eab308'
];

const ctx2=document.getElementById('popularCatsChart').getContext('2d');
if(popularCatsChart)popularCatsChart.destroy();

if(catNames.length===0){
// If no products exist, show a message
popularCatsChart=new Chart(ctx2,{
type:'bar',
data:{labels:['No data'],datasets:[{data:[0],backgroundColor:'#ccc'}]},
options:{
responsive:true,
plugins:{
legend:{display:false},
title:{display:true,text:'Add products to see popular categories',color:textColor,font:{size:14}}
},
scales:{
x:{display:false},
y:{display:false}
}
}
});
}else{
popularCatsChart=new Chart(ctx2,{
type:'bar',
data:{
labels:catNames,
datasets:[{
label:'Products',
data:catCountsValues,
backgroundColor:catNames.map((_,i)=>barColors[i%barColors.length]+'cc'),
borderColor:catNames.map((_,i)=>barColors[i%barColors.length]),
borderWidth:2,
borderRadius:8,
borderSkipped:false
}]
},
options:{
indexAxis:'y',
responsive:true,
maintainAspectRatio:false,
animation:{duration:1500,easing:'easeOutQuart'},
plugins:{
legend:{display:false},
tooltip:{
backgroundColor:isDark?'#1e293b':'#fff',
titleColor:isDark?'#F9FAFB':'#111827',
bodyColor:isDark?'#94a3b8':'#64748b',
borderColor:isDark?'#334155':'#e2e8f0',
borderWidth:1,
padding:12,
cornerRadius:8,
callbacks:{
label:function(context){
return ` ${context.parsed.x} product${context.parsed.x>1?'s':''}`;
}
}
}
},
scales:{
x:{
ticks:{color:textColor,stepSize:1},
grid:{color:gridColor},
beginAtZero:true,
title:{display:true,text:'Number of Products',color:textColor,font:{size:12}}
},
y:{
ticks:{color:textColor,font:{size:12,weight:'600'}},
grid:{display:false}
}
}
}
});

// Set canvas height based on number of categories
const canvasHeight=Math.max(250,catNames.length*40+60);
document.getElementById('popularCatsChart').style.height=canvasHeight+'px';
}
}


              </script>
                        </body>
                        </html>
